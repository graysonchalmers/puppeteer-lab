services:
  mocap-api:
    build: .
    restart: unless-stopped
    # Shared 2 GB box: one max-size (50 MB) upload costs ~200 MB of heap to parse, so MAX_CONCURRENT_UPLOADS defaults to 1. Raise this to ~1g before allowing 2.
    mem_limit: 512m
    ports:
      # Loopback only: Caddy on the same box is the only client, and the rate limiter trusts X-Forwarded-For because of that.
      - "127.0.0.1:3016:8787"
    env_file:
      - .env.local
    environment:
      # Fixed here (environment beats env_file): PORT must match the port mapping above and DATA_DIR the volume below.
      - HOST=0.0.0.0
      - PORT=8787
      - DATA_DIR=/data
    volumes:
      - /home/grayson/mocap-data:/data
